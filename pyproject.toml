[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelforge"
version = "0.1.0"
description = "CLI-first evidence-bound MUN tactical POI research engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=4", "python-docx>=1"]
test = ["pytest>=8"]

[project.scripts]
intelforge = "intelforge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
