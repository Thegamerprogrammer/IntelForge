[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelforge"
version = "0.1.0"
description = "CLI-first evidence-bound MUN tactical POI research engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4",
  "python-docx>=1",
  "PyYAML>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
intelforge = "intelforge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
